
<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow">
    <meta name="description" content="Mathe-Trainer mit fallenden Rechenaufgaben, Combo-System und globaler Rangliste.">
    <title>Mathe-Trainer</title>

    <style>
        * { box-sizing: border-box; }

        :root {
            --cyan: #00d2ff;
            --mint: #00ffcc;
            --gold: #ffaa00;
            --panel: rgba(15, 23, 42, 0.94);
            --deep: rgba(3, 7, 18, 0.78);
        }

        body {
            font-family: Arial, sans-serif;
            background-image: url('assets/neon-bg.jpg');
            background-attachment: fixed;
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            background-color: #030712;
            color: #fff;
            min-height: 100vh;
            margin: 0;
            padding: 28px;
        }

        .page-shell {
            width: 100%;
            max-width: 1120px;
            margin: 0 auto;
            display: grid;
            grid-template-columns: minmax(0, 1fr) 310px;
            gap: 22px;
            align-items: start;
        }

        .game-container,
        .leaderboard-panel {
            background: var(--panel);
            backdrop-filter: blur(10px);
            border: 2px solid var(--cyan);
            border-radius: 15px;
            box-shadow: 0 0 20px rgba(0, 210, 255, 0.25);
        }

        .game-container {
            padding: 25px;
            text-align: center;
            min-width: 0;
            transition: border-color 0.3s ease, box-shadow 0.3s ease;
        }

        h1 {
            color: var(--cyan);
            margin: 0 0 6px;
            font-size: 30px;
        }

        .subtitle {
            color: #a0aec0;
            font-size: 14px;
            margin: 0 0 18px;
        }

        .player-name {
            width: 100%;
            max-width: 280px;
            padding: 10px;
            margin: 8px 0 14px;
            border: 1px solid var(--cyan);
            border-radius: 6px;
            background: #030712;
            color: white;
            text-align: center;
            font-size: 16px;
        }

        .player-name:focus,
        .game-input:focus {
            outline: none;
            box-shadow: 0 0 12px rgba(0, 210, 255, 0.5);
        }

        .combo-badge {
            font-size: 16px;
            color: #ff4d83;
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 1px;
            min-height: 26px;
            text-shadow: 0 0 10px rgba(255, 0, 85, 0.5);
        }

        .box-container {
            position: relative;
            width: 100%;
            height: 350px;
            background: var(--deep);
            border: 1px solid rgba(0, 210, 255, 0.35);
            border-radius: 8px;
            overflow: hidden;
            margin-bottom: 15px;
        }

        .falling-question {
            position: absolute;
            left: 0;
            right: 0;
            top: 0;
            font-size: 28px;
            color: #fff;
            font-weight: bold;
            text-shadow: 0 0 10px var(--cyan);
        }

        .game-input {
            width: 150px;
            padding: 10px;
            font-size: 22px;
            border-radius: 6px;
            border: 2px solid var(--cyan);
            background: #030712;
            color: white;
            text-align: center;
            margin-bottom: 12px;
        }

        .game-input:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .stats-container {
            display: flex;
            justify-content: space-around;
            gap: 10px;
            margin-top: 12px;
            font-weight: bold;
            font-size: 18px;
            flex-wrap: wrap;
        }

        .score-display { color: var(--mint); }
        .highscore-display { color: var(--gold); }

        .game-over {
            display: none;
            margin-top: 18px;
        }

        .game-over h2 { color: #ff4d83; }

        .restart-btn {
            background: transparent;
            color: var(--mint);
            border: 1px solid var(--mint);
            border-radius: 6px;
            padding: 11px 22px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.2s ease;
            margin: 8px 0;
        }

        .restart-btn:hover {
            background: var(--mint);
            color: #030712;
        }

        .restart-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .leaderboard-panel {
            padding: 20px;
            text-align: left;
            position: sticky;
            top: 24px;
        }

        .leaderboard-panel h2 {
            color: var(--gold);
            font-size: 21px;
            text-align: center;
            margin: 0 0 8px;
        }

        .leaderboard-note {
            color: #a0aec0;
            text-align: center;
            font-size: 12px;
            margin: 0 0 16px;
        }

        .leaderboard {
            margin: 0;
            padding: 0;
            list-style: none;
            counter-reset: rank;
        }

        .leaderboard li {
            counter-increment: rank;
            display: flex;
            align-items: flex-start;
            gap: 9px;
            padding: 10px 8px;
            margin: 0 0 7px;
            background: var(--deep);
            border: 1px solid rgba(0, 210, 255, 0.16);
            border-radius: 7px;
            overflow-wrap: anywhere;
            font-size: 14px;
        }

        .leaderboard li::before {
            content: counter(rank) ".";
            color: var(--cyan);
            font-weight: bold;
            min-width: 22px;
        }

        #saveStatus {
            font-size: 13px;
            color: #a0aec0;
            min-height: 18px;
            margin-top: 12px;
            text-align: center;
        }

        .footer-note {
            color: #8d9bb0;
            font-size: 12px;
            margin: 18px 0 0;
        }

        @media (max-width: 760px) {
            body { padding: 14px; }

            .page-shell {
                grid-template-columns: minmax(0, 1fr);
                max-width: 520px;
                gap: 16px;
            }

            .leaderboard-panel {
                position: static;
                order: 2;
            }

            .game-container { padding: 20px; }
            .leaderboard-panel { padding: 17px; }
        }

        @media (max-width: 480px) {
            body { padding: 10px; }
            .game-container { padding: 16px; }
            h1 { font-size: 25px; }
            .box-container { height: 320px; }
            .falling-question { font-size: 25px; }
            .stats-container { font-size: 16px; }
        }
    </style>
</head>

<body>
    <main class="page-shell">

        <section class="game-container" id="gameCard" aria-label="Mathe-Trainer">

            <h1>Mathe-Trainer</h1>
            <p class="subtitle">Übe Kopfrechnen und sammle Punkte</p>

            <label for="playerName">Dein Spielername:</label><br>

            <input
                type="text"
                id="playerName"
                class="player-name"
                maxlength="20"
                placeholder="Name eingeben"
                autocomplete="nickname"
            >

            <div>
                <button type="button" class="restart-btn" id="startBtn">
                    Spiel starten
                </button>
            </div>

            <div class="combo-badge" id="comboText" aria-live="polite"></div>

            <div class="box-container" id="gameArea">
                <div class="falling-question" id="questionText">
                    Bereit?
                </div>
            </div>

            <input
                type="number"
                id="userInput"
                class="game-input"
                placeholder="?"
                aria-label="Ergebnis eingeben"
                autocomplete="off"
                inputmode="numeric"
                disabled
            >

            <div class="stats-container">
                <div class="score-display">
                    Punkte: <span id="scoreText">0</span>
                </div>

                <div class="highscore-display">
                    Highscore: <span id="highscoreText">0</span>
                </div>
            </div>

            <div class="game-over" id="gameOver">
                <h2>Spiel beendet!</h2>
                <p>Deine Punkte: <strong id="finalScore">0</strong></p>

                <button type="button" class="restart-btn" id="restartBtn">
                    Nochmal spielen
                </button>
            </div>

            <p class="footer-note">Mathe-Trainer · Schulversion</p>

        </section>

        <aside class="leaderboard-panel" aria-live="polite">
            <h2>Globale Top 10</h2>
            <p class="leaderboard-note">Die besten Punktestände</p>

            <ol class="leaderboard" id="leaderboardList">
                <li>Rangliste wird geladen ...</li>
            </ol>

            <div id="saveStatus" role="status" aria-live="polite"></div>
        </aside>

    </main>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <script>
        // Supabase-Einstellungen
        const SUPABASE_URL = "https://llvunpjwlwyefuzabqah.supabase.co";

        const SUPABASE_ANON_KEY =
            "sb_publishable_NJE8YQ96N-5sA2hVNVrfBg_a1STgKjX";

        const GAME_FUNCTION_URL =
            SUPABASE_URL + "/functions/v1/mathe-trainer-game";

        const supabaseClient = window.supabase?.createClient
            ? window.supabase.createClient(
                SUPABASE_URL,
                SUPABASE_ANON_KEY
            )
            : null;


        // Spielvariablen
        let score = 0;
        let highscore = 0;
        let currentY = 0;

        const startSpeed = 1.2;
        let fallSpeed = startSpeed;

        let gameInterval = null;
        let answerTimeout = null;

        let isGameOver = true;
        let canAnswer = false;
        let requestInProgress = false;

        let sessionToken = null;
        let scoreSubmitted = false;


        // HTML-Elemente
        const gameCard = document.getElementById("gameCard");
        const gameArea = document.getElementById("gameArea");
        const questionText = document.getElementById("questionText");
        const userInput = document.getElementById("userInput");

        const scoreText = document.getElementById("scoreText");
        const highscoreText = document.getElementById("highscoreText");
        const comboText = document.getElementById("comboText");

        const gameOverBox = document.getElementById("gameOver");
        const finalScore = document.getElementById("finalScore");

        const startBtn = document.getElementById("startBtn");
        const restartBtn = document.getElementById("restartBtn");

        const playerNameInput = document.getElementById("playerName");
        const leaderboardList = document.getElementById("leaderboardList");
        const saveStatus = document.getElementById("saveStatus");


        // Verbindung zum sicheren Spielserver
        async function callGameServer(action, extraData = {}) {

            const response = await fetch(GAME_FUNCTION_URL, {
                method: "POST",

                headers: {
                    "Content-Type": "application/json",
                    "apikey": SUPABASE_ANON_KEY
                },

                body: JSON.stringify({
                    action,
                    ...extraData
                })
            });

            let data;

            try {
                data = await response.json();
            } catch (error) {
                throw new Error("Ungültige Serverantwort.");
            }

            if (!response.ok) {
                throw new Error(
                    data.error || "Die Verbindung zum Spielserver ist fehlgeschlagen."
                );
            }

            return data;
        }


        // Bestenliste laden
        async function loadLeaderboard() {

            if (!supabaseClient) {
                leaderboardList.innerHTML =
                    "<li>Supabase-Verbindung nicht verfügbar.</li>";
                return;
            }

            const { data, error } = await supabaseClient
                .from("highscores")
                .select("player_name, score, created_at")
                .order("score", { ascending: false })
                .limit(10);

            if (error) {
                leaderboardList.innerHTML =
                    "<li>Rangliste konnte nicht geladen werden.</li>";

                console.error("Highscore laden:", error);
                return;
            }

            leaderboardList.innerHTML = "";

            if (!data || data.length === 0) {
                leaderboardList.innerHTML =
                    "<li>Noch keine Einträge – spiele als Erster!</li>";
                return;
            }

            data.forEach((entry) => {
                const li = document.createElement("li");

                li.textContent =
                    `${entry.player_name} – ${entry.score} Punkte`;

                leaderboardList.appendChild(li);
            });
        }


        // Lokalen persönlichen Highscore laden
        function loadHighscore() {

            try {
                const savedHighscore =
                    localStorage.getItem("mathDropHighscore");

                if (savedHighscore !== null) {
                    const parsed = Number.parseInt(savedHighscore, 10);

                    if (Number.isFinite(parsed) && parsed >= 0) {
                        highscore = parsed;
                    }
                }

            } catch (error) {
                highscore = 0;
            }

            highscoreText.textContent = highscore;
        }


        function updateHighscore() {

            if (score > highscore) {
                highscore = score;
                highscoreText.textContent = highscore;

                try {
                    localStorage.setItem("mathDropHighscore", highscore);
                } catch (error) {
                    // Das Spiel funktioniert auch ohne lokalen Speicher.
                }
            }
        }


        // Server-Aufgabe anzeigen
        function showQuestion(data) {

            const num1 = data.current_num1;
            const num2 = data.current_num2;
            const operator = data.current_operator;

            const displayOperator =
                operator === "*" ? "×" : operator;

            questionText.textContent =
                `${num1} ${displayOperator} ${num2}`;

            currentY = 0;
            questionText.style.top = "0px";

            userInput.value = "";
        }


        // Spielgeschwindigkeit
        function updateSpeed() {

            if (score < 15) {
                fallSpeed = startSpeed + (score * 0.03);

            } else if (score < 40) {
                fallSpeed =
                    startSpeed + 0.45 + ((score - 15) * 0.05);

            } else {
                fallSpeed =
                    startSpeed + 1.7 + ((score - 40) * 0.1);
            }

            fallSpeed = Math.min(fallSpeed, 8);
        }


        // Fallanimation
        function startFalling() {

            clearInterval(gameInterval);

            gameInterval = setInterval(() => {

                if (isGameOver || !canAnswer) return;

                currentY += fallSpeed;

                questionText.style.top = currentY + "px";

                const maxY =
                    gameArea.clientHeight - questionText.offsetHeight;

                if (currentY >= maxY) {
                    endGame();
                }

            }, 30);
        }


        // Neue Spielrunde starten
        async function startGame() {

            if (requestInProgress) return;

            const playerName = playerNameInput.value.trim();

            if (!playerName) {
                saveStatus.textContent =
                    "Bitte gib zuerst deinen Namen ein.";

                playerNameInput.focus();
                return;
            }

            requestInProgress = true;
            startBtn.disabled = true;
            restartBtn.disabled = true;

            saveStatus.textContent = "Starte Spiel ...";

            try {

                const data = await callGameServer("start", {
                    player_name: playerName
                });

                sessionToken = data.token;

                score = 0;
                scoreText.textContent = "0";

                scoreSubmitted = false;
                isGameOver = false;
                canAnswer = true;

                fallSpeed = startSpeed;
                currentY = 0;

                comboText.textContent = "";
                gameOverBox.style.display = "none";

                startBtn.style.display = "none";

                gameCard.style.borderColor = "#00d2ff";
                gameCard.style.boxShadow =
                    "0 0 20px rgba(0, 210, 255, 0.25)";

                showQuestion(data);

                userInput.disabled = false;
                userInput.focus();

                saveStatus.textContent = "Viel Erfolg!";

                startFalling();

            } catch (error) {

                console.error("Spielstart:", error);

                saveStatus.textContent =
                    error.message || "Spiel konnte nicht gestartet werden.";

                startBtn.disabled = false;
            }

            requestInProgress = false;
            restartBtn.disabled = false;
        }


        // Antwort prüfen lassen
        async function checkAnswer() {

            if (
                !canAnswer ||
                isGameOver ||
                requestInProgress ||
                !sessionToken
            ) {
                return;
            }

            const answerText = userInput.value.trim();

            if (answerText === "") return;

            const userAnswer = Number(answerText);

            if (!Number.isSafeInteger(userAnswer)) return;

            canAnswer = false;
            requestInProgress = true;

            try {

                const data = await callGameServer("answer", {
                    token: sessionToken,
                    answer: userAnswer
                });

                if (!data.correct) {

                    canAnswer = true;
                    userInput.value = "";

                    requestInProgress = false;
                    return;
                }

                // Punkte kommen ausschließlich vom Server.
                score = data.score;
                scoreText.textContent = score;

                updateHighscore();
                updateSpeed();

                if (data.combo_count >= 6) {
                    comboText.textContent = "Mega Combo x3!";

                } else if (data.combo_count >= 3) {
                    comboText.textContent = "Combo x2!";

                } else {
                    comboText.textContent = "";
                }

                clearInterval(gameInterval);
                gameInterval = null;

                gameCard.style.borderColor = "#00ffcc";
                gameCard.style.boxShadow =
                    "0 0 30px rgba(0, 255, 204, 0.55)";

                showQuestion(data);

                answerTimeout = setTimeout(() => {

                    answerTimeout = null;

                    if (isGameOver) return;

                    gameCard.style.borderColor = "#00d2ff";
                    gameCard.style.boxShadow =
                        "0 0 20px rgba(0, 210, 255, 0.25)";

                    canAnswer = true;
                    startFalling();
                    userInput.focus();

                }, 200);

            } catch (error) {

                console.error("Antwortprüfung:", error);

                saveStatus.textContent =
                    error.message || "Antwort konnte nicht geprüft werden.";

                // Bei einem abgelaufenen Zeitfenster wird die Runde beendet.
                if (
                    error.message &&
                    error.message.toLowerCase().includes("abgelaufen")
                ) {
                    requestInProgress = false;
                    endGame();
                    return;
                }

                canAnswer = true;

            }

            requestInProgress = false;
        }


        // Spiel beenden und Punktestand serverseitig speichern
        async function endGame() {

            if (isGameOver) return;

            isGameOver = true;
            canAnswer = false;

            clearInterval(gameInterval);
            clearTimeout(answerTimeout);

            gameInterval = null;
            answerTimeout = null;

            userInput.disabled = true;

            updateHighscore();

            finalScore.textContent = score;
            gameOverBox.style.display = "block";

            comboText.textContent = "";

            gameCard.style.borderColor = "#ff0055";
            gameCard.style.boxShadow =
                "0 0 30px rgba(255, 0, 85, 0.65)";

            if (!sessionToken || scoreSubmitted) return;

            scoreSubmitted = true;

            saveStatus.textContent =
                "Speichere Punktestand ...";

            try {

                const data = await callGameServer("end", {
                    token: sessionToken
                });

                if (data.success) {

                    saveStatus.textContent =
                        "Punktestand gespeichert!";

                    await loadLeaderboard();

                } else {

                    saveStatus.textContent =
                        "Punktestand konnte nicht gespeichert werden.";
                }

            } catch (error) {

                console.error("Spiel beenden:", error);

                saveStatus.textContent =
                    "Speichern fehlgeschlagen. Bitte später erneut versuchen.";

            }

            sessionToken = null;
        }


        // Ereignisse
        startBtn.addEventListener("click", startGame);
        restartBtn.addEventListener("click", startGame);

        userInput.addEventListener("input", checkAnswer);

        userInput.addEventListener("keydown", event => {
            if (event.key === "Enter") {
                checkAnswer();
            }
        });


        // Initialisierung
        loadHighscore();
        loadLeaderboard();

        userInput.disabled = true;
        restartBtn.disabled = false;

    </script>
</body>
</html>
